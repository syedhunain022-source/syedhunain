name: Generate GitHub Profile Insights

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: syedhunain022-source
          BRANCH_NAME: main
          UTC_OFFSET: 5
          AUTO_PUSH: true
          THEME: github_dark
          ANIMATION: ""
          NAME: "Syed Hunain Ahmed"
